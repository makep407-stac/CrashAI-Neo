name: CrashAI Neo free collector

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vendor-zakaria-monitoring
    paths:
      - "vendor/zakaria-monitoring/**"
      - ".github/workflows/crashai-free-collector.yml"

permissions:
  contents: read

concurrency:
  group: crashai-free-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/vendor-zakaria-monitoring

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        working-directory: vendor/zakaria-monitoring
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run collector and relay for a short session
        working-directory: vendor/zakaria-monitoring
        env:
          DATABASE_URL: ${{ secrets.CRASH_DATABASE_URL }}
          CRASHAI_API_URL: https://crashai-neo-api.onrender.com
          CRASHAI_INGEST_KEY: ${{ secrets.CRASHAI_INGEST_KEY }}
          ZAKARIA_USER_TOKEN: ${{ secrets.ZAKARIA_USER_TOKEN }}
          ZAKARIA_SESSION: ${{ secrets.ZAKARIA_SESSION }}
          ZAKARIA_ACCESS_TOKEN: ${{ secrets.ZAKARIA_ACCESS_TOKEN }}
          ZAKARIA_ACCOUNT_ID: ${{ secrets.ZAKARIA_ACCOUNT_ID }}
        run: |
          for name in DATABASE_URL CRASHAI_INGEST_KEY ZAKARIA_USER_TOKEN ZAKARIA_SESSION ZAKARIA_ACCESS_TOKEN ZAKARIA_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          timeout --signal=TERM --kill-after=20s 7m python run_services.py || code=$?
          if [ "${code:-0}" -ne 124 ] && [ "${code:-0}" -ne 0 ]; then
            exit "$code"
          fi
