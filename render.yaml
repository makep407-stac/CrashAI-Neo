services:
  - type: worker
    name: zakaria-crash-collector
    runtime: python
    region: oregon
    plan: starter
    branch: feature/vendor-zakaria-monitoring
    rootDir: vendor/zakaria-monitoring
    buildCommand: pip install -r requirements.txt
    startCommand: python run_services.py
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crashai-neo-db
          property: connectionString
      - key: CRASHAI_API_URL
        value: https://crashai-neo-api.onrender.com
      - key: CRASHAI_INGEST_KEY
        fromService:
          type: web
          name: crashai-neo-api
          envVarKey: CRASHAI_INGEST_KEY
      - key: ZAKARIA_USER_TOKEN
        sync: false
      - key: ZAKARIA_SESSION
        sync: false
      - key: ZAKARIA_ACCESS_TOKEN
        sync: false
      - key: ZAKARIA_ACCOUNT_ID
        sync: false
