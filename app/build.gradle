plugins {
    id 'com.android.application'
}

android {
    namespace 'sf.grh.crash'
    compileSdk 35

    defaultConfig {
        applicationId 'sf.grh.crash'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}


dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
